title: Livewire Inline Translation
description: "Edit translations inline on the page in a Laravel Livewire app: an authorised user clicks the text, a modal opens and the new value is stored in the database."
url: https://arviddejong.github.io
baseurl: /livewire-inline-translation

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# Facts about the package, used by the structured data and llms.txt.
package:
  name: darvis/livewire-inline-translation
  repository: https://github.com/ArvidDeJong/livewire-inline-translation
  packagist: https://packagist.org/packages/darvis/livewire-inline-translation
  license_url: https://github.com/ArvidDeJong/livewire-inline-translation/blob/main/LICENSE
  requires: PHP 8.2+, Laravel 11, 12 or 13, Livewire 3 or 4
  platforms: [Laravel, Livewire]
  keywords: [laravel, livewire, translation, localization, i18n, inline editing, database translations, content editing, cms]

# Developer credit in the footer and the structured data.
developer:
  company: ARVID.NL
  url: https://arvid.nl

color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/ArvidDeJong/livewire-inline-translation
  Packagist: https://packagist.org/packages/darvis/livewire-inline-translation
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/ArvidDeJong/livewire-inline-translation
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

# Social preview image for every page (Open Graph and Twitter card, through jekyll-seo-tag).
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/social-preview.png
